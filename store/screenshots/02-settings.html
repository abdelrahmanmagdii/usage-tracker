<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UsageBar screenshot 2 — settings</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      color: #17131f;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 88% 8%, rgba(125, 104, 246, .42), transparent 36%),
        linear-gradient(165deg, #c9c3dc, #b7b0d4);
    }
    .shot { padding: 64px 72px; }
    .kicker { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: rgba(48,41,64,.52); }
    h1 { margin: 8px 0 28px; font-size: 42px; letter-spacing: -0.04em; }
    .card {
      width: 420px; padding: 18px; border-radius: 22px;
      background: linear-gradient(152deg, rgba(253,251,255,.94), rgba(232,236,255,.84));
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 28px 70px rgba(54,38,94,.22);
    }
    .row { display: flex; justify-content: space-between; margin-top: 10px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.7); }
    .row strong { font-size: 15px; }
    .btn { margin-top: 16px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 11px; color: #fff; background: linear-gradient(145deg, #7765ee, #526ff3); font-weight: 650; }
  </style>
</head>
<body>
  <div class="shot">
    <div class="kicker">Settings</div>
    <h1>Pick the tools. Pin the window.</h1>
    <div class="card">
      <div style="font-weight:650">Tools</div>
      <div class="row"><span>Codex</span><strong>On</strong></div>
      <div class="row"><span>Claude Code</span><strong>On</strong></div>
      <div class="row"><span>Cursor</span><strong>On</strong></div>
      <div class="row"><span>OpenCode Go</span><strong>On</strong></div>
      <div class="btn">Settings</div>
    </div>
  </div>
</body>
</html>
