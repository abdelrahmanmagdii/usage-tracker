<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UsageBar screenshot 2 — share</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 800px; background: #0c0b10; color: #f3efe6; font-family: ui-sans-serif, system-ui; overflow: hidden; }
    .shot { padding: 72px; }
    .kicker { letter-spacing: .16em; text-transform: uppercase; color: #e39b7a; font-size: 13px; }
    h1 { font-family: Georgia, serif; font-size: 48px; margin: 8px 0 28px; }
    .card { width: 960px; height: 420px; border-radius: 28px; padding: 36px 40px; background: linear-gradient(#14121c, #0a090e); border: 1px solid rgba(255,255,255,.12); }
    .pct { font-size: 120px; font-weight: 700; letter-spacing: -0.06em; color: #3dd68c; }
    .btns { margin-top: 28px; display: flex; gap: 12px; }
    .btns span { padding: 12px 18px; border-radius: 999px; background: #111; }
    .btns span.li { background: #0a66c2; }
  </style>
</head>
<body>
  <div class="shot">
    <div class="kicker">Share to X and LinkedIn</div>
    <h1>A 16:9 card. Quota only.</h1>
    <div class="card">
      <div style="opacity:.55;letter-spacing:.2em;font-size:12px;">USAGEBAR</div>
      <div class="pct">63%</div>
      <div>5-HOUR CODEX QUOTA LEFT · resets in 2h 12m</div>
    </div>
    <div class="btns"><span>Post on X</span><span class="li">LinkedIn</span><span>macOS share sheet</span></div>
  </div>
</body>
</html>
