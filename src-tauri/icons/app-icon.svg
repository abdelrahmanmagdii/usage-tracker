<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- UsageBar app icon source. The two-bar mark (tall Codex bar, short Claude
       bar) matches the menu-bar glyph, the popover badge, and the share-card
       lockup. Regenerate the bundle icons with:
         npm run tauri icon src-tauri/icons/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e67f6"/>
      <stop offset="1" stop-color="#4e68f4"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.85" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#241a6e" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
    <linearGradient id="barAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a688"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#2a1c7a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#gloss)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="228" fill="none" stroke="url(#edge)" stroke-width="10"/>
  <g filter="url(#barShadow)">
    <rect x="312" y="312" width="160" height="400" rx="80" fill="url(#barMain)"/>
    <rect x="552" y="487" width="160" height="225" rx="80" fill="url(#barAccent)"/>
  </g>
</svg>
