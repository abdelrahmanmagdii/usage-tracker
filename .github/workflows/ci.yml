name: CI

# Pull requests and main get the full check on macOS, the platform most of
# the app's native code (Keychain, AppKit, vibrancy) only compiles on.
# Before this job, that code was first built when a release tag was pushed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version fields agree
        run: npm run versions:check

      - run: npm run typecheck

      - run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Correctness and suspicious lints fail the build. Style lints are
      # reported but not enforced yet, since the codebase still carries some.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness -D clippy::suspicious
