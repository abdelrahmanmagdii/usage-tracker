name: CI

# Pull requests and main get the full check on macOS, the platform most of
# the app's native code (Keychain, AppKit, vibrancy) only compiles on.
# Before this job, that code was first built when a release tag was pushed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the old run. Runs on main all
# finish, so every merge gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Only main saves the Rust cache. Pull requests restore it, but saving
      # one multi-GB macOS cache per PR branch would evict main's from the
      # repository's 10 GB cache quota.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Version fields agree
        run: npm run versions:check

      - run: npm run typecheck

      - run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Correctness and suspicious lints fail the build. Style lints are
      # reported but not enforced yet, since the codebase still carries some.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness -D clippy::suspicious
