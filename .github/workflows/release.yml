name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # The release is named and tagged after github.ref_name, so a manual run
    # on a branch would publish a public "latest" release tagged e.g. `main`
    # and serve it to every installed copy's updater. Dispatch on a v* tag to
    # re-run a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # Creates the GitHub release and uploads its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Every version field must match the pushed tag, or the release would
      # publish a build (and an updater manifest) under the wrong version.
      - run: npm run versions:check

      # A broken build is worse than a late one, so gate the release on the
      # same checks used during development.
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # notarytool reads the App Store Connect key from a file on disk.
      # Through env rather than an inline expression, so the shell never parses the
      # key's contents.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Throwaway password for the temporary keychain the CLI creates.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          # Notarization
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          # Updater artifact signing (minisign). Required: tauri.conf.json
          # ships the updater pubkey with createUpdaterArtifacts on, so the
          # CLI refuses to bundle without it (tools/tauri.mjs only relaxes
          # that outside CI).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # One universal download rather than separate Intel/Apple Silicon builds.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: UsageBar ${{ github.ref_name }}
          releaseBody: |
            Signed and notarized build. Download the `.dmg`, open it, and drag
            UsageBar to Applications.

            Windows (beta): the `-setup.exe` installer is attached by the
            Windows workflow a few minutes later. It is not code-signed yet, so
            SmartScreen asks once (More info → Run anyway), and it does not
            auto-update.
          # Publish straight away: tests gate the job above, and installed
          # copies only see `latest.json` once the release is public.
          releaseDraft: false

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"

  # Keeps the Homebrew tap's cask on the released version. Skips until the tap
  # repo exists and HOMEBREW_TAP_REPO / HOMEBREW_TAP_TOKEN are configured —
  # see homebrew-tap/SETUP.md.
  cask:
    needs: release
    runs-on: ubuntu-latest
    # Reads the release; pushes to the tap with its own token.
    permissions:
      contents: read
    # Tag pushes only: a manual run on a branch has no release to checksum.
    if: vars.HOMEBREW_TAP_REPO != '' && startsWith(github.ref, 'refs/tags/v')
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync cask to the Homebrew tap
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping cask sync"
            exit 0
          fi
          VERSION="${TAG#v}"
          DMG="UsageBar_${VERSION}_universal.dmg"
          # Checksum the dmg users will actually download, so the tap pins
          # it instead of shipping `sha256 :no_check`.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DMG" --dir "$RUNNER_TEMP"
          SHA256=$(sha256sum "$RUNNER_TEMP/$DMG" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          mkdir -p tap/Casks
          sed -E \
            -e "s/^  version \".*\"$/  version \"${VERSION}\"/" \
            -e "s/^  sha256 .*/  sha256 \"${SHA256}\"/" \
            Casks/usagebar.rb > tap/Casks/usagebar.rb
          grep -q "version \"${VERSION}\"" tap/Casks/usagebar.rb
          grep -q "sha256 \"${SHA256}\"" tap/Casks/usagebar.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "cask already up to date"
            exit 0
          fi
          git add -A
          git commit -m "usagebar ${TAG#v}"
          git push
