name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a second run waits instead of racing the feeds.
concurrency:
  group: usagebar-release
  cancel-in-progress: false

jobs:
  # Stops a rerun from overwriting or downgrading a public release, before
  # anything is built or uploaded. A draft left by a failed run is retried.
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag is stable, matches the version and is newer than the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(gh api graphql -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { isDraft } } }' -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$GITHUB_REF_NAME" --jq 'if .data.repository.release == null then "absent" elif .data.repository.release.isDraft then "draft" else "public" end')
          case "$target" in absent|draft) ;; *) echo '::error::Refusing to change an existing public release'; exit 1 ;; esac
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          node tools/packages.mjs check-release "$GITHUB_REF_NAME" "$latest"
          npm run versions:check

  # The signed Windows installer, updater signature, feed and WinGet manifests,
  # built before any release is made public.
  windows:
    needs: preflight
    uses: ./.github/workflows/windows.yml
    with:
      signed: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    needs: [preflight, windows]
    # The release is named and tagged after github.ref_name, so a manual run
    # on a branch would publish a public "latest" release tagged e.g. `main`
    # and serve it to every installed copy's updater. Dispatch on a v* tag to
    # re-run a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # Creates the GitHub release and uploads its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Every version field must match the pushed tag, or the release would
      # publish a build (and an updater manifest) under the wrong version.
      - run: npm run versions:check

      # A broken build is worse than a late one, so gate the release on the
      # same checks used during development.
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # notarytool reads the App Store Connect key from a file on disk.
      # Through env rather than an inline expression, so the shell never parses the
      # key's contents.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Throwaway password for the temporary keychain the CLI creates.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          # Notarization
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          # Updater artifact signing (minisign). Required: tauri.conf.json
          # ships the updater pubkey with createUpdaterArtifacts on, so the
          # CLI refuses to bundle without it (tools/tauri.mjs only relaxes
          # that outside CI).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # One universal download rather than separate Intel/Apple Silicon builds.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: UsageBar ${{ github.ref_name }}
          releaseBody: |
            Signed and notarized macOS build. Download the `.dmg`, open it,
            and drag UsageBar to Applications, or use Homebrew (see the
            README). The app updates itself.

            Windows (beta): `UsageBar_<version>_x64-setup.exe`. The installer
            is not Authenticode-signed, so SmartScreen asks once (More info,
            then Run anyway). UsageBar 0.2.5 on Windows cannot update itself:
            install this version once by hand or with WinGet. From this
            version on, the app downloads verified updates and installs them
            when you choose Install Update in the tray menu.
          # Stays a draft until the Windows files are attached and checked.
          releaseDraft: true

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"

      - name: Collect the Windows release files
        uses: actions/download-artifact@v4
        with:
          name: UsageBar-Windows
          path: windows-release

      - name: Attach Windows files to the draft, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          exe="UsageBar_${version}_x64-setup.exe"
          # Never touch a release that is already public.
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]
          cp "windows-release/$exe" windows-release/UsageBar_windows_x64-setup.exe
          gh release upload "$TAG" --clobber \
            "windows-release/$exe" \
            "windows-release/$exe.sig" \
            windows-release/latest-windows.json \
            "windows-release/UsageBar_${version}_winget.zip" \
            windows-release/UsageBar_windows_x64-setup.exe

          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for required in \
            "UsageBar_${version}_universal.dmg" "$exe" "$exe.sig" \
            UsageBar_universal.app.tar.gz UsageBar_universal.app.tar.gz.sig \
            latest.json latest-windows.json "UsageBar_${version}_winget.zip" \
            UsageBar_windows_x64-setup.exe; do
            grep -Fxq "$required" <<<"$assets" || { echo "::error::missing release asset $required"; exit 1; }
          done

          mkdir verify
          gh release download "$TAG" --dir verify \
            --pattern latest.json --pattern latest-windows.json \
            --pattern UsageBar_universal.app.tar.gz.sig --pattern "$exe.sig"
          node tools/packages.mjs verify-feeds "$version" verify

          gh release edit "$TAG" --draft=false --latest

  # Pins the cask in this repository (it is the tap) to the published DMG.
  # Pushes normally to the default branch; if branch protection refuses, run
  # `node tools/packages.mjs cask <version> <dmg>` locally (docs/RELEASING.md).
  cask:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin the cask to the published disk image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg="UsageBar_${version}_universal.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg" --dir "$RUNNER_TEMP"
          node tools/packages.mjs cask "$version" "$RUNNER_TEMP/$dmg"
          git add Casks/usagebar.rb homebrew-tap/Casks/usagebar.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "usagebar ${version}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
