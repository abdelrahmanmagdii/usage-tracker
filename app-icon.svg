<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    UsageBar app icon: two quota "activity rings" in the app's own palette —
    purple for Codex, coral for Claude Code — on deep indigo glass.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2a2452"/>
      <stop offset=".55" stop-color="#191537"/>
      <stop offset="1" stop-color="#110e26"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".28" cy=".2" r=".9">
      <stop stop-color="#8b7bff" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx=".82" cy=".9" r=".8">
      <stop stop-color="#d97757" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringOuter" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6a9ff"/>
      <stop offset="1" stop-color="#6957e8"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffbd93"/>
      <stop offset="1" stop-color="#d96f4b"/>
    </linearGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bloom)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bloom2)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="216" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="8"/>

  <!-- Ring tracks -->
  <circle cx="512" cy="512" r="332" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="92"/>
  <circle cx="512" cy="512" r="208" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="92"/>

  <!-- Glow under the arcs -->
  <path d="M512 180 A332 332 0 1 1 185 569.8" fill="none" stroke="#7c6bff" stroke-opacity=".55" stroke-width="100" stroke-linecap="round" filter="url(#soften)"/>
  <path d="M512 304 A208 208 0 0 1 583.1 707.5" fill="none" stroke="#e58a63" stroke-opacity=".5" stroke-width="100" stroke-linecap="round" filter="url(#soften)"/>

  <!-- Outer ring: Codex (≈72% remaining) -->
  <path d="M512 180 A332 332 0 1 1 185 569.8" fill="none" stroke="url(#ringOuter)" stroke-width="92" stroke-linecap="round"/>
  <!-- Inner ring: Claude (≈45% remaining) -->
  <path d="M512 304 A208 208 0 0 1 583.1 707.5" fill="none" stroke="url(#ringInner)" stroke-width="92" stroke-linecap="round"/>

  <!-- Arc start highlights -->
  <circle cx="512" cy="180" r="20" fill="#ffffff" fill-opacity=".85"/>
  <circle cx="512" cy="304" r="18" fill="#ffffff" fill-opacity=".8"/>
</svg>
