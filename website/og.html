<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>UsageBar</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #ffffff;
    }
    .wrap { display: grid; grid-template-columns: 1.1fr .9fr; height: 630px; padding: 0 72px; gap: 56px; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
    .brand img { border-radius: 6px; }
    h1 { margin: 0 0 18px; max-width: 11em; font-size: 58px; font-weight: 700; letter-spacing: -.032em; line-height: 1.08; }
    p { margin: 0; font-size: 22px; line-height: 1.45; color: #4b4b52; max-width: 24ch; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 28px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 550; color: #4b4b52; }
    .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
    .stage { display: flex; justify-content: center; }
    .stage img { display: block; width: 370px; filter: drop-shadow(0 20px 44px rgba(0,0,0,.16)); }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand"><img src="mark.svg" width="30" height="30" alt="" />UsageBar</div>
      <h1>Your AI coding quota, in the menu bar.</h1>
      <p>Codex, Claude Code, Cursor, and OpenCode Go. Remaining percent and reset times, same as the official apps.</p>
      <div class="chips">
        <span class="chip" style="--dot:#6356e8">Codex</span>
        <span class="chip" style="--dot:#c9703a">Claude Code</span>
        <span class="chip" style="--dot:#2f9e77">Cursor</span>
        <span class="chip" style="--dot:#6f5ff0">OpenCode Go</span>
      </div>
    </div>
    <div class="stage">
      <img src="screens/popover-codex.png" alt="" />
    </div>
  </div>
</body>
</html>
